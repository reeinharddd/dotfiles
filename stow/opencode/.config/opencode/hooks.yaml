# Global hooks.yaml — runs for ALL projects
# Minimal: only safety blocks. Per-project hooks go in .opencode/hooks.yaml
hooks:
  # Block known destructive patterns globally
  - event: tool.before.bash
    action: stop
    actions:
      - bash: |
          payload=$(cat)
          cmd=$(printf '%s' "$payload" | jq -r '.tool_args.command // empty' 2>/dev/null || true)
          case "$cmd" in
            *"rm -rf"*|*"sudo rm "*|*"mkfs"*|*"dd if="*|*"git reset --hard"*|*"git clean"*|*"git push --force"*|*"wp db reset"*)
              echo "Blocked destructive bash command by global hook." >&2
              exit 2
              ;;
          esac

  # Checkpoint STATE.md on idle — idempotent replace of one marker line (no unbounded append)
  # Use literal block scalar | (preserves newlines) — fold scalar >- merges the
  # if/fi blocks onto one line, producing "fi if" which is invalid bash syntax.
  - event: session.idle
    actions:
      - bash: |
          if [ -x "$OPENCODE_PROJECT_DIR/.opencode/auto-save.sh" ]; then
            bash "$OPENCODE_PROJECT_DIR/.opencode/auto-save.sh"
          fi
          state="$OPENCODE_PROJECT_DIR/.opencode/STATE.md"
          if [ -f "$state" ]; then
            ts=$(date '+%Y-%m-%d %H:%M')
            tmp=$(mktemp)
            # Drop any prior checkpoint line, then append exactly one current marker
            grep -v '^Last checkpoint: ' "$state" > "$tmp" || cp "$state" "$tmp"
            printf '\nLast checkpoint: %s - session idle (idempotent)\n' "$ts" >> "$tmp"
            mv "$tmp" "$state"
          fi

  # Desktop notification when child sessions (subagents) finish a tool
  # Notify only for meaningful tools to avoid spam; async to not block the agent.
  - event: tool.execute.after
    scope: child
    async: true
    actions:
      - bash: |
          payload=$(cat)
          event=$(printf '%s' "$payload" | jq -r '.event // empty' 2>/dev/null || true)
          tool=$(printf '%s' "$payload" | jq -r '.tool_name // empty' 2>/dev/null || true)
          case "$tool" in
            bash|edit|write)
              notify-send -a opencode -t 4000 "OpenCode subagent" "tool finished: ${tool:-unknown}" 2>/dev/null || true
              ;;
          esac
