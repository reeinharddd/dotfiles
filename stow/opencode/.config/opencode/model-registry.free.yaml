# Free-only model registry — Routing Guard validates against this (never decides routes).

# free:KNOWN  → allowed as primary + fallback
# free:QUOTA  → allowed as fallback only (separate free quota, not metered API)
# free:UNKNOWN → NOT routed (primary or fallback)

models:
  # opencode-zen free tier
  opencode-zen/mimo-v2.6-flash-free: { free: KNOWN }
  opencode-zen/mimo-v2.5-free: { free: KNOWN }
  opencode-zen/nemotron-3-ultra-free: { free: KNOWN }
  opencode-zen/nemotron-3.5-lightning-free: { free: KNOWN }
  opencode-zen/ling-3.0-flash-fin-free: { free: KNOWN }
  opencode-zen/muse-spark-1.3-contributor-free: { free: KNOWN }

  # openrouter free
  openrouter/dots-studio/dots-3-note-preview:free: { free: KNOWN }

  # nvidia free endpoints (as configured)
  nvidia/deepseek-ai/deepseek-v4-flash-0731: { free: KNOWN }

  # Antigravity — free quota, not metered API (fallback only)
  google/antigravity-claude-sonnet-4-6: { free: QUOTA }
  google/antigravity-gemini-3.8-flash: { free: QUOTA }

  # Default / may be free-inside-OpenCode — treat as QUOTA until proven metered
  google/gemini-3.8-flash: { free: QUOTA }
  google/gemini-3.5-flash-lite: { free: QUOTA }
  google/gemini-2.5-flash-lite: { free: QUOTA }

  # Mistral / other: UNKNOWN until verified free — guard rejects as primary;
  # currently used only as OMO fallback → update after bench confirmation
  mistral/mistral-medium-latest: { free: UNKNOWN }
  mistral/ministral-8b-latest: { free: UNKNOWN }

policy:
  primary: [KNOWN]
  fallback: [KNOWN, QUOTA]
  on_unknown: reject   # free=UNKNOWN → not routed
