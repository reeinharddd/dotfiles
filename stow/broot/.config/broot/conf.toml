# ┌──────────────────────────────────────────────────────────────────┐
# │ Broot config — terminal file tree manager                            │
# │ https://github.com/Canop/broot                                     │
# └──────────────────────────────────────────────────────────────────┘

# Verb: edit in nvim
[[verbs]]
name = "edit"
invocation = "nvim {file}"
key = "F1"
shortcut = "e"
description = "Edit in nvim"

# Verb: open in code
[[verbs]]
name = "code"
invocation = "code {file}"
key = "F2"
shortcut = "c"
description = "Open in VSCode"

# Verb: copy path to clipboard
[[verbs]]
name = "clippath"
invocation = "wl-copy {file}"
key = "ctrl+y"
shortcut = "y"
description = "Copy path to clipboard"

# Verb: copy file content
[[verbs]]
name = "clipcontent"
invocation = "cat {file} | wl-copy"
key = "ctrl+shift+y"
shortcut = "Y"
description = "Copy file content to clipboard"

# Verb: mkdir
[[verbs]]
name = "mkdir"
invocation = "mkdir -p {parent}/{new_dir}"
key = "F7"
shortcut = "m"
description = "Create new directory"
leave_broot = false

# Verb: touch file
[[verbs]]
name = "touch"
invocation = "touch {file}"
key = "F5"
shortcut = "t"
description = "Create new file"
leave_broot = false

# Verb: git status
[[verbs]]
name = "git_status"
invocation = "git -C {dir} status"
key = "F3"
shortcut = "g"
description = "Git status"
leave_broot = false

# Verb: git diff
[[verbs]]
name = "git_diff"
invocation = "git -C {dir} diff"
key = "F4"
shortcut = "d"
description = "Git diff"
leave_broot = false

# Verb: lazygit
[[verbs]]
name = "lazygit"
invocation = "lazygit {dir}"
key = "F6"
shortcut = "l"
description = "Open lazygit"
leave_broot = true

# Verb: yazi
[[verbs]]
name = "yazi"
invocation = "yazi {dir}"
key = "F8"
shortcut = "y"
description = "Open yazi"
leave_broot = true

# Verb: extract archive
[[verbs]]
name = "extract"
invocation = "ouch x {file}"
key = "F9"
shortcut = "x"
description = "Extract archive"
leave_broot = false

# Verb: compress
[[verbs]]
name = "compress"
invocation = "ouch c {file}.zip {file}"
key = "ctrl+F9"
shortcut = "X"
description = "Compress to zip"
leave_broot = false

# Verb: trash
[[verbs]]
name = "trash"
invocation = "gio trash {file}"
key = "ctrl+delete"
description = "Move to trash"
leave_broot = false

# Verb: show disk usage
[[verbs]]
name = "size"
invocation = "dust {dir}"
key = "F11"
description = "Disk usage of dir"
leave_broot = false

# Verb: permissions
[[verbs]]
name = "chmodx"
invocation = "chmod +x {file}"
key = "F12"
description = "Make executable"
leave_broot = false

