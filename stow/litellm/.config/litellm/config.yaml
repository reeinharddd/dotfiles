# LiteLLM Proxy Configuration
# Run via: docker run -p 4000:4000 -v ~/.config/litellm:/app/config ghcr.io/berriai/litellm:main-v1.83.0 --config /app/config/config.yaml

model_list:
  # Anthropic via OpenRouter (free tier)
  - model_name: "claude-3-5-sonnet"
    litellm_params:
      model: "openrouter/anthropic/claude-3.5-sonnet"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # Google Gemini (free tier)
  - model_name: "gemini-2.5-pro"
    litellm_params:
      model: "gemini/gemini-2.5-pro"
      api_key: "os.environ/GOOGLE_API_KEY"

  # DeepSeek R1 via OpenRouter (free)
  - model_name: "deepseek-r1"
    litellm_params:
      model: "openrouter/deepseek/deepseek-r1:free"
      api_key: "os.environ/OPENROUTER_API_KEY"

  # Local models via Ollama
  - model_name: "llama3.1"
    litellm_params:
      model: "ollama/llama3.1"
      api_base: "http://host.docker.internal:11434"
      api_key: "ollama"

  - model_name: "qwen2.5-coder"
    litellm_params:
      model: "ollama/qwen2.5-coder"
      api_base: "http://host.docker.internal:11434"
      api_key: "ollama"

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  max_budget: 10.0
  drop_params: true
  set_verbose: false

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  max_parallel_requests: 4

router_settings:
  routing_strategy: "usage-based-routing"
  enable_retries: true
  num_retries: 2
  retry_after: 5

# Virtual keys for different use cases
# Create with: litellm --generate_key --key_alias=opencode --max_budget=5 --models=claude-3-5-sonnet,gemini-2.5-pro
