# mise config — gestor universal de runtimes y tools
# https://mise.jdx.dev

[tools]
# Runtimes
node = "lts"
python = "latest"
go = "latest"
bun = "latest"

# Modern CLI tools
bat = "latest"
delta = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
just = "latest"
ripgrep = "latest"
starship = "latest"
lazygit = "latest"
jq = "latest"
yq = "latest"
direnv = "latest"

# 2026 upgrade: shell history
atuin = "latest"

# 2026 upgrade: process queue
"aqua:Nukesor/pueue/pueue" = "latest"

# 2026 upgrade: HTTP client
"aqua:ducaale/xh" = "latest"

# TOML is handled by yq (the maintained multi-format processor already installed below).
ruff = "latest"
shfmt = "latest"
marksman = "latest"
supabase = "latest"
yt-dlp = { version = "latest", rename_exe = "yt-dlp" }
codex = "latest"
shellcheck = "latest"
glab = "latest"
zellij = "latest"
actionlint = "latest"
miller = "latest"
sd = "latest"
navi = "latest"
tokei = "latest"
choose = "latest"
doggo = "latest"
gping = "latest"
grex = "latest"
watchexec = "latest"
herdr = "latest"
deno = "latest"
"cargo:difftastic" = "latest"
"cargo:tealdeer" = "latest"
"cargo:ouch" = "latest"
"cargo:bandwhich" = "latest"
"cargo:procs" = "latest"
"cargo:onefetch" = "latest"
rtk = "latest"

[settings]
always_keep_download = false
