# Hyprland 0.53+ Config — Catppuccin Mocha base + matugen dynamic colors

# Colores dinámicos generados por matugen (bordes/sombras)
source = ~/.config/hypr/matugen-colors.conf

monitor=,preferred,auto,1

exec-once = swww-daemon &
exec-once = waybar &
exec-once = mako &
exec-once = cliphist store &
exec-once = wl-paste --watch cliphist store &
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP &
exec-once = /usr/lib/polkit-1/polkit-agent-helper-1 hyprpolkitagent &

input {
    kb_layout = latam
    kb_variant =
    kb_options = compose:ralt
    follow_mouse = 1
    mouse_refocus = true
    touchpad {
        natural_scroll = yes
        tap-to-click = true
    }
}

general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(cba6f7ff) rgba(f5c2e7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244ff)
    layout = dwindle
    allow_tearing = false
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.95
    shadow {
        enabled = true
        range = 12
        offset = 0 2
        color = rgba(00000066)
    }
    blur {
        enabled = true
        size = 5
        passes = 3
    }
}

animations {
    enabled = yes
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    animation = fade, 1, 4, default
    animation = border, 1, 5, default
}

$mainMod = SUPER

bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, B, exec, brave
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, yazi
bind = $mainMod, V, exec, cliphist-menu.sh
bind = $mainMod, T, exec, ghostty -e tv
bind = $mainMod, A, exec, ghostty -e herdr
bind = $mainMod, G, exec, ghostty -e lazygit
bind = $mainMod, N, exec, ghostty -e nvim
bind = $mainMod, X, exec, ghostty -e btop
bind = $mainMod, L, exec, swaylock -f -c 1e1e2e

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod ALT, right, resizeactive, 50 0
bind = $mainMod ALT, left, resizeactive, -50 0
bind = $mainMod ALT, up, resizeactive, 0 -50
bind = $mainMod ALT, down, resizeactive, 0 50

bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, space, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

bind = $mainMod, TAB, cyclenext, prev
bind = $mainMod SHIFT, TAB, cyclenext, next

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot saved"

# AI hub
bind = $mainMod, O, exec, ghostty -e opencode
bind = $mainMod SHIFT, O, exec, ~/.local/bin/ocp

bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bind = CTRL_ALT, T, exec, ghostty

# Window rules v2: windowrule = OPTION VALUE CONDITION
# Valid options: workspace, float, opacity, rounding, pin, size, position, monitor
windowrule = workspace 1 class:^(code)$
windowrule = workspace 2 class:^(ghostty)$
windowrule = workspace 2 class:^(kitty)$
windowrule = workspace 3 class:^(brave)$
windowrule = workspace 3 class:^(firefox)$

windowrule = float true class:^(pavucontrol)$
windowrule = float true class:^(blueman-manager)$
windowrule = float true class:^(nm-connection-editor)$
windowrule = float true class:^(telegram-desktop)$
windowrule = float true class:^(zoom)$
windowrule = float true class:^(slack)$
windowrule = float true class:^(file-roller)$
windowrule = float true title:^(Picture in picture)$

windowrule = opacity 0.9 class:^(kitty)$
windowrule = opacity 0.9 class:^(ghostty)$

windowrule = rounding 0 fullscreen
windowrule = rounding 0 floating

# Layer rules: layerrule = OPTION NAMESPACE
layerrule = blur waybar
layerrule = blur mako

