# ┌──────────────────────────────────────────────────────────────────┐
# │ Hyprland config polished — Catppuccin theme                         │
# │ https://wiki.hyprland.org/Configuring/                                │
# └──────────────────────────────────────────────────────────────────┘

# ─── Monitores ──────────────────────────────────────────────────
monitor=,preferred,auto,1

# ─── Autostart ──────────────────────────────────────────────────
exec-once = waybar
exec-once = mako
exec-once = cliphist store
exec-once = swaync
exec-once = wl-paste --watch cliphist store
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemd --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/lib/polkit-1/polkit-agent-helper-1 hyprpolkitagent

# ─── Input ──────────────────────────────────────────────────────
input {
    kb_layout = latam
    kb_variant =
    kb_options = compose:ralt

    follow_mouse = 1
    mouse_refocus = true

    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        clickfinger_behavior = true
        middle_button_emulation = true
        disable_while_typing = true
    }

    # TrackPoint - ThinkPad
    touchpoint {
        accel_profile = "adaptive"
    }

    # Edge gestures
    workspace_swipe = true
    workspace_swipe_fingers = 3
    workspace_swipe_distance = 300
    workspace_swipe_touchpad = true

    # Tap and drag
    tap-and-drag = true
    drag_lock = true
}

# ─── General ────────────────────────────────────────────────────
general {
    gaps_in = 3
    gaps_out = 6
    border_size = 2

    # Catppuccin Mocha gradient borders
    col.active_border = rgba(cba6f7ff) rgba(f5c2e7ff) rgba(89b4faff) 45deg
    col.inactive_border = rgba(313244ff)

    layout = dwindle
    allow_tearing = false

    cursor {
        no_hardware_cursors = true
    }

    screenshot_paste_clipboard = true
}

# ─── Decoration ─────────────────────────────────────────────────
decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 1.0
    inactive_opacity = 0.95
    dim_inactive = false
    dim_group = 0
    dim_special = 0.4

    shadow {
        enabled = true
        range = 12
        render_power = 3
        offset = 0 2
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 5
        passes = 3
        optimize = true
        new_optimizations = true
    }
}

# ─── Animations ─────────────────────────────────────────────────
animations {
    enabled = yes

    bezier = "easeOutQuint", 0.23, 1, 0.32, 1
    bezier = "easeInOutCubic", 0.65, 0.05, 0.36, 1
    bezier = "linear", 0, 0, 1, 1

    animation = "fade", 1, 4, "easeOutQuint"
    animation = "border", 1, 5, "easeOutQuint"
    animation = "workspace", 1, 4, "easeInOutCubic", false
    animation = "windows", 1, 4, "easeOutQuint"
    animation = "windowsMove", 1, 4, "easeOutQuint"
    animation = "windowsSwitch", 1, 3, "easeInOutCubic"
}

# ─── Keybindings ────────────────────────────────────────────────
$mainMod = SUPER

# Apps
bind = $mainMod, RETURN, exec, ghostty
bind = $mainMod, D, exec, fuzzel
bind = $mainMod, B, exec, brave
bind = $mainMod, F, exec, firefox
bind = $mainMod, E, exec, yazi
bind = $mainMod, V, exec, cliphist-menu.sh
bind = $mainMod, T, exec, ghostty -e tv
bind = $mainMod, A, exec, ghostty -e herdr
bind = $mainMod, G, exec, ghostty -e lazygit
bind = $mainMod, N, exec, ghostty -e nvim
bind = $mainMod, X, exec, ghostty -e btop
bind = $mainMod, L, exec, swaylock -f -c 1e1e2e

# Workspace nav (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Move/resize
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize
bind = $mainMod ALT, right, resizeactive, 50 0
bind = $mainMod ALT, left, resizeactive, -50 0
bind = $mainMod ALT, up, resizeactive, 0 -50
bind = $mainMod ALT, down, resizeactive, 0 50

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, space, togglefloating
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit

# Workspace nav (cycle)
bind = $mainMod, TAB, cyclenext, prev
bind = $mainMod SHIFT, TAB, cyclenext, next

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim - | wl-copy
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot saved"

# Audio / Brightness
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindl = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ─── Window rules ───────────────────────────────────────────────
# Apps to specific workspaces
windowrulev2 = workspace 1 silent, class:^(code)$
windowrulev2 = workspace 2 silent, class:^(ghostty)$
windowrulev2 = workspace 2 silent, class:^(kitty)$
windowrulev2 = workspace 3 silent, class:^(brave)$
windowrulev2 = workspace 3 silent, class:^(firefox)$

# Floating rules
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(telegram-desktop)$
windowrulev2 = float, class:^(zoom)$
windowrulev2 = float, class:^(slack)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, title:^(Picture in picture)$

# Opacity
windowrulev2 = opacity 0.9 0.9, class:^(kitty)$
windowrulev2 = opacity 0.9 0.9, class:^(ghostty)$

# No border
windowrulev2 = noborder, fullscreen
windowrulev2 = noborder, floating
windowrulev2 = rounding 0, fullscreen

# Layer rules
layerrule = blur, waybar
layerrule = ignorealpha 0.5, waybar
layerrule = blur, mako
layerrule = noanim, waybar
layerrule = noanim, mako

# Misc
misc {
    vfr = true
    mouse_move_focuses_monitor = true
    allow_session_lock_restore = true
    enable_anr_dialog = true
    background_color = rgb(111111)
}
