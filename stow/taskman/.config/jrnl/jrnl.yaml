colors: true
default_hour: 9
default_minute: 0
editor: nvim
encrypt: false
highlight: true
indent_character: '|'
journals:
  default:
    journal: $HOME/.local/share/jrnl/journal.txt
  health:
    journal: $HOME/.local/share/jrnl/health.txt
  ideas:
    journal: $HOME/.local/share/jrnl/ideas.txt
  work:
    journal: $HOME/.local/share/jrnl/work.txt
line_length: 110
linewrap: 79
tagsymbols: '@'
template: '{body}'
timeformat: '%H:%M'
version: v4.3