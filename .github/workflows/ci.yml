name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bootstrap:
    name: Bootstrap & Verify
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update -qq && apt-get install -y -qq \
            curl wget git stow zsh build-essential \
            unzip xz-utils ca-certificates jq \
            zsh-syntax-highlighting zsh-autosuggestions \
            python3 python3-pip shellcheck

      - name: Run bootstrap (dry-run)
        run: |
          chmod +x bootstrap.sh
          MISE_VERSION=v2025.10.6 ./bootstrap.sh --dry-run || true

      - name: Simulate stow
        run: ./scripts/stow-sync.sh --dry-run

      - name: Shellcheck scripts
        run: shellcheck scripts/*.sh

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run gitleaks (HEAD only — matches instructions/03-quality-gates.md gate)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks detect --no-git --redact --verbose

  validate-json:
    name: Validate JSON Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate opencode.jsonc (JSONC, full-line comments stripped)
        run: |
          python3 - <<'PY'
          import json
          lines = [l for l in open('stow/opencode/.config/opencode/opencode.jsonc') if not l.lstrip().startswith('//')]
          json.loads(''.join(lines))
          print('opencode.jsonc valid')
          PY

      - name: Validate oh-my-openagent.json
        run: |
          python3 - <<'PY'
          import json
          json.load(open('stow/opencode/.config/opencode/oh-my-openagent.json'))
          print('oh-my-openagent.json valid')
          PY

  check-duplicates:
    name: Check Duplicate Configs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Root opencode.jsonc must be symlink to canonical .config copy
        run: |
          test -L stow/opencode/opencode.jsonc
          test "$(readlink stow/opencode/opencode.jsonc)" = ".config/opencode/opencode.jsonc"
          diff -u stow/opencode/.config/opencode/opencode.jsonc stow/opencode/opencode.jsonc
