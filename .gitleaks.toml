title = "dotfiles"

[extend]
useDefault = true

[[rules]]
id = "url-embedded-token"
description = "Token en la ruta de una URL (p. ej. MCP remotos)"
regex = '''https?://(?:mcp|api)\.[A-Za-z0-9.-]+/[A-Za-z0-9_-]{24,}(?:/|\b)'''
tags = ["url", "token"]

[[rules]]
id = "inline-password"
description = "Contraseña escrita en línea en docs/instrucciones (p. ej. reglas de agente)"
regex = '''(?i)\bpass(?:word|wd)\b\s*[:=]?\s*`[^`\s]{4,}`'''
tags = ["password"]

[[rules]]
id = "sudo-stdin-password"
description = "echo <pw> | sudo -S"
regex = '''(?i)echo\s+['"]?[^\s|'"`<]{4,}['"]?\s*\|\s*sudo\s+-S'''
tags = ["password", "sudo"]

[allowlist]
description = "Falsos positivos conocidos"
paths = [
  '''(^|/)package-lock\.json$''',
  '''(^|/)\.env\.sops$''',
  '''(^|/)\.sops\.yaml$''',
]