# Gitleaks config
title = "Dotfiles Gitleaks Config"

[allowlist]
description = "Allowlist for gitleaks"
paths = [
  "(?i)^stow/opencode/.config/opencode/opencode\\.json$",  # Generated mirror, gitignored
]

# Custom rules for tokens in URLs (Firecrawl, etc.)
[[rules]]
id = "firecrawl-url-token"
description = "Detect Firecrawl API tokens in URLs"
regex = '''https?://[^/\s]+/[A-Za-z0-9_-]{28,}/'''
tags = ["api-key", "url"]

[[rules]]
id = "generic-url-token"
description = "Detect generic tokens in URLs"
regex = '''https?://[^/\s]+/[A-Za-z0-9_-]{32,}/'''
tags = ["api-key", "url"]

# Standard gitleaks rules (enabled by default)
# To disable a rule, add it here with `enabled = false`